[build-system]
requires = ["setuptools>=45", "wheel", "Cython>=3.0.0", "numpy>=1.20.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guillotine-cutter"
version = "0.1.0"
description = "2D guillotine cutting optimizer with defect handling"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
