[build-system]
requires = ["setuptools>=45", "wheel", "Cython>=3.0.0", "numpy>=1.20.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guillotine-cutter"
version = "0.1.0"
description = "2D guillotine cutting optimizer with defect handling"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
]

[project.scripts]
guillotine = "guillotine.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "coverage>=6.0.0",
    "build>=0.7.0",
    "ipython>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
