<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gdcut</title>
  <style>
    /* ── reset ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── page layout ── */
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #c8a85a;
      color: #2c1a0e;
      height: 100vh;
      overflow: hidden;
      padding: 1rem 2rem;
      display: flex;
      flex-direction: column;
    }

    /* ── page title ── */
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2c1a0e;
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── panel section headings ── */
    h2 {
      font-size: 0.82rem;
      font-weight: 600;
      color: #5c3a1e;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    /* ── three-column grid: left editor | center plot | right stats ── */
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr 200px;
      gap: 1.2rem;
      max-width: 1400px;
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* ── left column: scrollable editor panels ── */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 0;
      overflow: hidden;
    }

    /* ── card panel ── */
    .panel {
      background: #f5e6c8;
      border: 1px solid #a07840;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      flex-shrink: 0;
    }

    /* ── items and defects panels: flex column to allow inner scroll ── */
    .panel-scroll {
      background: #f5e6c8;
      border: 1px solid #a07840;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }

    /* ── scrollable table container ── */
    .table-scroll {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      margin-bottom: 0.5rem;
    }

    .field { margin-bottom: 0.6rem; }

    label {
      display: block;
      font-size: 0.72rem;
      color: #7a5230;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input[type="number"] {
      width: 100%;
      background: #fdf5e6;
      border: 1px solid #a07840;
      border-radius: 2px;
      color: #000000;
      padding: 0.3rem 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: "Courier New", Courier, monospace;
    }
    input[type="number"]:focus { outline: none; border-color: #5c3a1e; }

    .row   { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
    .row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.4rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    th {
      text-align: left;
      color: #7a5230;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.25rem 0.3rem;
      border-bottom: 1px solid #a07840;
      position: sticky;
      top: 0;
      background: #f5e6c8;
    }
    td { padding: 0.25rem 0.3rem; border-bottom: 1px solid #e0c990; }
    td input[type="number"] { padding: 0.15rem 0.3rem; }

    .btn-remove {
      background: none; border: none;
      color: #8b2e0e; cursor: pointer;
      font-size: 0.9rem; padding: 0 0.2rem;
    }
    .btn-remove:hover { color: #c0392b; }

    /* ── primary button ── */
    button {
      background: #5c3a1e; border: none;
      border-radius: 3px; color: #f5e6c8;
      cursor: pointer; font-size: 0.82rem;
      font-weight: 600; padding: 0.4rem 0.9rem;
      letter-spacing: 0.03em;
      font-family: Georgia, "Times New Roman", serif;
    }
    button:hover { background: #7a5230; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── secondary button ── */
    button.secondary { background: #d4a95a; color: #2c1a0e; }
    button.secondary:hover { background: #c8a85a; }

    .btn-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    /* ── bottom of left col: save/load/solve always visible ── */
    .left-bottom {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    /* ── status message ── */
    #status {
      font-size: 0.82rem;
      min-height: 1rem;
      color: #7a5230;
      flex-shrink: 0;
    }
    #status.ok  { color: #2d6a2d; }
    #status.err { color: #8b2e0e; }

    /* ── center panel ── */
    #canvas-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #f5e6c8;
      border: 1px solid #a07840;
      border-radius: 4px;
      padding: 0.75rem 1rem;
    }

    /* ── panel top row: title + mode tabs ── */
    #panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      margin-bottom: 0.2rem;
    }

    #canvas-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: #5c3a1e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── solve status row (below title) ── */
    #solve-status-row {
      display: none;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #000000;
      flex-shrink: 0;
      margin-bottom: 0.2rem;
    }
    #solve-status-row.visible { display: flex; }

    /* ── CSS spinner ── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #ccbbaa;
      border-top-color: #000000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── mode tabs ── */
    #mode-tabs { display: flex; gap: 0.4rem; }

    .tab-btn {
      background: #d4a95a;
      color: #2c1a0e;
      border: 1px solid #a07840;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      cursor: pointer;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.04em;
    }
    .tab-btn:hover { background: #c8a85a; }
    .tab-btn.active { background: #5c3a1e; color: #f5e6c8; border-color: #5c3a1e; }

    /* ── hint text ── */
    #canvas-hint {
      font-size: 0.72rem;
      color: #a07840;
      text-align: right;
      flex-shrink: 0;
      margin-bottom: 0.3rem;
      font-style: italic;
    }

    /* ── canvas drawing area ── */
    #canvas-area {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #fdf5e6;
      border: 1px solid #a07840;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a07840;
      font-size: 0.85rem;
      cursor: grab;
      position: relative;
    }
    #canvas-area:active { cursor: grabbing; }
    #canvas-area canvas { display: block; position: absolute; top: 0; left: 0; }

    /* ── solution step controls ── */
    #sol-controls {
      display: none;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding-top: 0.5rem;
    }
    #sol-controls.visible { display: flex; }

    #step-counter {
      font-size: 1rem;
      font-weight: 700;
      color: #2c1a0e;
      min-width: 80px;
      text-align: center;
    }

    .step-btn {
      background: #5c3a1e; color: #f5e6c8;
      border: none; border-radius: 3px;
      font-size: 1.1rem;
      width: 32px; height: 32px;
      cursor: pointer;
      font-family: Georgia, serif;
      display: flex; align-items: center; justify-content: center;
    }
    .step-btn:hover:not(:disabled) { background: #7a5230; }
    .step-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    #step-info {
      font-size: 0.75rem;
      color: #7a5230;
      text-align: center;
      min-height: 1rem;
      flex-shrink: 0;
      padding-top: 0.15rem;
    }

    /* ── right column: stats panel ── */
    #stats-panel {
      display: flex;
      flex-direction: column;
      background: #f5e6c8;
      border: 1px solid #a07840;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      gap: 0.6rem;
      min-height: 0;
    }

    .stat-block {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid #e0c990;
    }
    .stat-block:last-child { border-bottom: none; }

    .stat-label {
      font-size: 0.68rem;
      color: #7a5230;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .stat-value {
      font-size: 0.9rem;
      font-weight: 700;
      color: #2c1a0e;
      font-family: "Courier New", monospace;
    }

    .stat-na { color: #a07840; font-style: italic; font-weight: normal; font-size: 0.8rem; }
  </style>
</head>
<body>

<!-- ── page title ── -->
<h1>gdcut — guillotine cutting solver</h1>

<div class="layout">

  <!-- ══════════════════════════════════════════
       LEFT COLUMN — problem editor
  ══════════════════════════════════════════ -->
  <div class="left-col">

    <!-- sheet dimensions -->
    <div class="panel">
      <h2>Sheet</h2>
      <div class="row">
        <div class="field">
          <label>Width</label>
          <input type="number" id="sheet-w" value="100" min="1" oninput="renderSheet()">
        </div>
        <div class="field">
          <label>Height</label>
          <input type="number" id="sheet-h" value="100" min="1" oninput="renderSheet()">
        </div>
      </div>
    </div>

    <!-- items panel with scrollable table -->
    <div class="panel-scroll">
      <h2>Items</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Width</th><th>Height</th><th>Profit</th><th></th></tr></thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>
      <!-- new item input row — always visible -->
      <div class="row-3">
        <input type="number" id="new-w" placeholder="w" min="1">
        <input type="number" id="new-h" placeholder="h" min="1">
        <input type="number" id="new-p" placeholder="profit" min="1">
      </div>
      <div class="btn-row">
        <button class="secondary" onclick="addItem()">+ Add item</button>
      </div>
    </div>

    <!-- defects panel with scrollable table -->
    <div class="panel-scroll">
      <h2>Defects</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>X</th><th>Y</th><th>W</th><th>H</th><th></th></tr></thead>
          <tbody id="defects-body"></tbody>
        </table>
      </div>
      <!-- new defect input row — always visible -->
      <div class="row-4">
        <input type="number" id="new-dx" placeholder="x" min="0">
        <input type="number" id="new-dy" placeholder="y" min="0">
        <input type="number" id="new-dw" placeholder="w" min="1">
        <input type="number" id="new-dh" placeholder="h" min="1">
      </div>
      <div class="btn-row">
        <button class="secondary" onclick="addDefect()">+ Add defect</button>
      </div>
    </div>

    <!-- always-visible bottom: save/load/solve -->
    <div class="panel">
      <h2>Solver</h2>
      <select id="solver-select" style="
        width: 100%; background: #fdf5e6; border: 1px solid #a07840;
        border-radius: 2px; color: #000; padding: 0.3rem 0.5rem;
        font-size: 0.85rem; font-family: Georgia, serif;">
        <option value="auto">Auto</option>
        <option value="iterative">Iterative</option>
        <option value="recursive">Recursive</option>
      </select>
    </div>

    <div class="left-bottom">
      <div class="btn-row">
        <button onclick="saveProblem()">Save</button>
        <button class="secondary" onclick="loadProblem()">Load</button>
        <button onclick="solveCurrentProblem()" id="btn-solve">Solve</button>
      </div>
      <div id="status"></div>
    </div>
    <!-- hidden file input -->
    <input type="file" id="file-input" accept=".json" style="display:none"
           onchange="onFileSelected(event)">

  </div><!-- end left-col -->

  <!-- ══════════════════════════════════════════
       CENTER COLUMN — visualizer
  ══════════════════════════════════════════ -->
  <div id="canvas-panel">

    <!-- panel header -->
    <div id="panel-top">
      <div id="canvas-title">No problem loaded</div>
      <div id="mode-tabs">
        <button class="tab-btn active" onclick="setMode('sheet')">Sheet</button>
        <button class="tab-btn" onclick="setMode('solution')" id="tab-solution" disabled>Solution</button>
      </div>
    </div>

    <!-- solve status row with spinner -->
    <div id="solve-status-row">
      <div class="spinner" id="solve-spinner" style="display:none"></div>
      <span id="solve-status-text"></span>
    </div>

    <!-- hint -->
    <div id="canvas-hint">scroll to zoom · drag to pan · WASD · R to reset</div>

    <!-- canvas -->
    <div id="canvas-area">
      <span id="canvas-placeholder">Load or save a problem to visualize the sheet.</span>
    </div>

    <!-- solution controls -->
    <div id="sol-controls">
      <button class="step-btn" onclick="solGo(0)" title="First">«</button>
      <button class="step-btn" id="btn-prev" onclick="solGo(solCur-1)">&#8592;</button>
      <div id="step-counter">0 / 0</div>
      <button class="step-btn" id="btn-next" onclick="solGo(solCur+1)">&#8594;</button>
      <button class="step-btn" onclick="solGo(solSteps.length-1)" title="Last">»</button>
    </div>
    <div id="step-info"></div>

  </div><!-- end canvas-panel -->

  <!-- ══════════════════════════════════════════
       RIGHT COLUMN — stats
  ══════════════════════════════════════════ -->
  <div id="stats-panel">
    <h2>Solution</h2>

    <div class="stat-block">
      <div class="stat-label">Value</div>
      <div class="stat-value" id="stat-value"><span class="stat-na">—</span></div>
    </div>

    <div class="stat-block">
      <div class="stat-label">Utilization</div>
      <div class="stat-value" id="stat-util"><span class="stat-na">—</span></div>
    </div>

    <div class="stat-block">
      <div class="stat-label">Efficiency</div>
      <div class="stat-value" id="stat-eff"><span class="stat-na">—</span></div>
    </div>

    <div class="stat-block">
      <div class="stat-label">Defect loss</div>
      <div class="stat-value" id="stat-def"><span class="stat-na">—</span></div>
    </div>

    <div class="stat-block">
      <div class="stat-label">Pieces</div>
      <div class="stat-value" id="stat-pieces" style="white-space: pre; font-size: 0.78rem;">
        <span class="stat-na">—</span>
      </div>
    </div>

    <div class="stat-block">
      <div class="stat-label">Solver</div>
      <div class="stat-value" id="stat-backend"><span class="stat-na">—</span></div>
    </div>

    <div class="stat-block">
      <div class="stat-label">Runtime</div>
      <div class="stat-value" id="stat-time"><span class="stat-na">—</span></div>
    </div>
  </div>

</div><!-- end layout -->

<script>
// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════
let items   = [];
let defects = [];
let currentFilename = null;
let currentMode = 'sheet';
let solutionData = null;

let viewZoom = 1.0;
let viewPanX = 0;
let viewPanY = 0;
let isPanning = false;
let panStartX = 0, panStartY = 0;
let panStartViewX = 0, panStartViewY = 0;
let sheetW = 100, sheetH = 100;
const MARGIN = 48;

let solSteps = [];
let solCur   = 0;
let solCutsMade = [];

const ITEM_COLORS = [
  '#4a90d9', '#e07b3a', '#5ab55a', '#c44d8a',
  '#8b5cf6', '#d4a017', '#2a9d8f', '#e63946',
  '#457b9d', '#f4a261', '#2d6a4f', '#9b2335'
];

// ══════════════════════════════════════════════════════════════════
// SOLVE STATUS
// ══════════════════════════════════════════════════════════════════
function setSolveStatus(msg, spinning) {
  const row = document.getElementById('solve-status-row');
  const spinner = document.getElementById('solve-spinner');
  const text = document.getElementById('solve-status-text');
  if (msg) {
    row.classList.add('visible');
    text.textContent = msg;
    spinner.style.display = spinning ? 'block' : 'none';
  } else {
    row.classList.remove('visible');
  }
}

// ══════════════════════════════════════════════════════════════════
// MODE SWITCHING
// ══════════════════════════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="setMode('${mode}')"]`).classList.add('active');

  const solControls = document.getElementById('sol-controls');
  const hint        = document.getElementById('canvas-hint');

  if (mode === 'sheet') {
    solControls.classList.remove('visible');
    hint.textContent = 'scroll to zoom · drag to pan · WASD · R to reset';
    renderSheet();
  } else {
    solControls.classList.add('visible');
    hint.textContent = '← → arrow keys · scroll to zoom · drag to pan';
    renderSolution();
  }
}

// ══════════════════════════════════════════════════════════════════
// ITEMS
// ══════════════════════════════════════════════════════════════════
function renderItems() {
  const tbody = document.getElementById('items-body');
  tbody.innerHTML = '';
  items.forEach((item, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="number" value="${item.width}"  min="1"
          oninput="items[${i}].width=+this.value"></td>
      <td><input type="number" value="${item.height}" min="1"
          oninput="items[${i}].height=+this.value"></td>
      <td><input type="number" value="${item.profit}" min="1"
          oninput="items[${i}].profit=+this.value"></td>
      <td><button class="btn-remove" onclick="removeItem(${i})">✕</button></td>`;
    tbody.appendChild(tr);
  });
}

function addItem() {
  const w = +document.getElementById('new-w').value;
  const h = +document.getElementById('new-h').value;
  const p = +document.getElementById('new-p').value || w * h;
  if (!w || !h) return setStatus('Item width and height are required.', true);
  items.push({ width: w, height: h, profit: p });
  ['new-w','new-h','new-p'].forEach(id => document.getElementById(id).value = '');
  renderItems();
}

function removeItem(i) { items.splice(i, 1); renderItems(); }

// ══════════════════════════════════════════════════════════════════
// DEFECTS
// ══════════════════════════════════════════════════════════════════
function renderDefects() {
  const tbody = document.getElementById('defects-body');
  tbody.innerHTML = '';
  defects.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="number" value="${d.x}"      min="0"
          oninput="defects[${i}].x=+this.value; renderSheet()"></td>
      <td><input type="number" value="${d.y}"      min="0"
          oninput="defects[${i}].y=+this.value; renderSheet()"></td>
      <td><input type="number" value="${d.width}"  min="1"
          oninput="defects[${i}].width=+this.value; renderSheet()"></td>
      <td><input type="number" value="${d.height}" min="1"
          oninput="defects[${i}].height=+this.value; renderSheet()"></td>
      <td><button class="btn-remove" onclick="removeDefect(${i})">✕</button></td>`;
    tbody.appendChild(tr);
  });
}

function addDefect() {
  const x = +document.getElementById('new-dx').value || 0;
  const y = +document.getElementById('new-dy').value || 0;
  const w = +document.getElementById('new-dw').value;
  const h = +document.getElementById('new-dh').value;
  if (!w || !h) return setStatus('Defect width and height are required.', true);
  defects.push({ x, y, width: w, height: h });
  ['new-dx','new-dy','new-dw','new-dh'].forEach(id =>
    document.getElementById(id).value = '');
  renderDefects();
  renderSheet();
}

function removeDefect(i) { defects.splice(i, 1); renderDefects(); renderSheet(); }

// ══════════════════════════════════════════════════════════════════
// STATUS
// ══════════════════════════════════════════════════════════════════
function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'err' : 'ok';
}

// ══════════════════════════════════════════════════════════════════
// BUILD PROBLEM JSON
// ══════════════════════════════════════════════════════════════════
function buildProblem() {
  const w = +document.getElementById('sheet-w').value;
  const h = +document.getElementById('sheet-h').value;
  if (!w || !h) { setStatus('Sheet dimensions are required.', true); return null; }
  return { problem: { sheet_size: [w, h], items, defects } };
}

// ══════════════════════════════════════════════════════════════════
// SAVE
// ══════════════════════════════════════════════════════════════════
function saveProblem() {
  const prob = buildProblem();
  if (!prob) return;
  const blob = new Blob([JSON.stringify(prob, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFilename || 'problem.json';
  a.click();
  URL.revokeObjectURL(a.href);
  currentFilename = a.download;
  setStatus('Saved ' + currentFilename, false);
  updateTitle();
  renderSheet();
}

// ══════════════════════════════════════════════════════════════════
// LOAD
// ══════════════════════════════════════════════════════════════════
function loadProblem() {
  document.getElementById('file-input').click();
}

function onFileSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  currentFilename = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      populateFromJSON(JSON.parse(e.target.result));
      setStatus('Loaded ' + currentFilename, false);
      updateTitle();
      resetView();
      renderSheet();
    } catch { setStatus('Invalid JSON file.', true); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function populateFromJSON(json) {
  const prob = json.problem || json;
  const [w, h] = prob.sheet_size || [100, 100];
  document.getElementById('sheet-w').value = w;
  document.getElementById('sheet-h').value = h;
  items = (prob.items || []).map(it => ({
    width: it.width, height: it.height,
    profit: it.profit !== undefined ? it.profit : (it.width * it.height)
  }));
  defects = (prob.defects || []).map(d => ({
    x: d.x, y: d.y, width: d.width, height: d.height
  }));
  renderItems();
  renderDefects();
}

function updateTitle() {
  document.getElementById('canvas-title').textContent =
    currentFilename ? 'Visualizing ' + currentFilename : 'No problem loaded';
}

// ══════════════════════════════════════════════════════════════════
// SOLVE
// ══════════════════════════════════════════════════════════════════
async function solveCurrentProblem() {
  const prob = buildProblem();
  if (!prob) return;

  setSolveStatus('Saving...', true);
  let res = await fetch('/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(prob, null, 2)
  });
  if (!res.ok) { setSolveStatus('Save failed.', false); return; }

  setSolveStatus('Solving...', true);
  const solverMode = document.getElementById('solver-select').value;
  res = await fetch('/solve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ solver: solverMode })
  });
  if (!res.ok) { setSolveStatus('Solve failed: ' + await res.text(), false); return; }

  setSolveStatus('Loading solution...', true);
  res = await fetch('/solution');
  if (!res.ok) { setSolveStatus('No solution found.', false); return; }

  solutionData = await res.json();
  loadSolution(solutionData);
  setSolveStatus('Solved — ' + solutionData.solution.utilization, false);
  setStatus('');
}

// ══════════════════════════════════════════════════════════════════
// SOLUTION — BFS
// ══════════════════════════════════════════════════════════════════
function loadSolution(sol) {
  const W = sol.problem.sheet_size[0];
  const H = sol.problem.sheet_size[1];
  const root = sol.solution.cut_sequence;

  const result = buildBFSSteps(root, W, H);
  solSteps    = result.steps;
  solCutsMade = result.cutsMade;
  solCur      = 0;

  // compute final piece counts from last BFS step
  const finalFrontier = result.steps[result.steps.length - 1];
  const itemCounts = {};
  let totalPieces = 0;
  for (const p of finalFrontier) {
    if (p.node && p.node.type === 'fill') {
      const item = sol.problem.items[p.node.item];
      if (!item) continue;
      const nx = Math.floor(p.w / item.width);
      const ny = Math.floor(p.h / item.height);
      const count = nx * ny;
      totalPieces += count;
      const key = item.width + '×' + item.height;
      itemCounts[key] = (itemCounts[key] || 0) + count;
    }
  }
  const pieceLines = Object.entries(itemCounts)
    .map(([k, v]) => v + ' × ' + k)
    .join('\n');
  document.getElementById('stat-pieces').textContent =
    totalPieces + (pieceLines ? '\n' + pieceLines : '');

  // update stats panel
  const s = sol.solution;
  document.getElementById('stat-value').textContent   = s.cut_area + ' / ' + s.total_area;
  document.getElementById('stat-util').textContent    = s.utilization;
  document.getElementById('stat-eff').textContent     = s.efficiency;
  document.getElementById('stat-def').textContent     = s.defect_loss;
  document.getElementById('stat-backend').textContent = s.backend || '—';
  document.getElementById('stat-time').textContent    =
    s.elapsed_s !== undefined ? s.elapsed_s.toFixed(3) + 's' : '—';

  const tabSol = document.getElementById('tab-solution');
  tabSol.disabled = false;
  tabSol.removeAttribute('disabled');

  setMode('solution');
  updateStepUI();
}

function buildBFSSteps(root, W, H) {
  const steps    = [];
  const cutsMade = [null]; // null for step 0
  let frontier = [{ x: 0, y: 0, w: W, h: H, node: root }];
  steps.push(frontier.slice());

  let changed = true;
  while (changed) {
    changed = false;
    const next = [];
    let expanded = false;
    let cutMade  = null;
    for (const p of frontier) {
      if (!expanded && p.node && p.node.type === 'cut_x') {
        const z = p.node.position;
        cutMade = { type: 'x', px: p.x, py: p.y, pw: p.w, ph: p.h, pos: z };
        next.push({ x: p.x,     y: p.y, w: z,     h: p.h, node: p.node.left  });
        next.push({ x: p.x + z, y: p.y, w: p.w-z, h: p.h, node: p.node.right });
        expanded = true; changed = true;
      } else if (!expanded && p.node && p.node.type === 'cut_y') {
        const z = p.node.position;
        cutMade = { type: 'y', px: p.x, py: p.y, pw: p.w, ph: p.h, pos: z };
        next.push({ x: p.x, y: p.y,     w: p.w, h: z,     node: p.node.left  });
        next.push({ x: p.x, y: p.y + z, w: p.w, h: p.h-z, node: p.node.right });
        expanded = true; changed = true;
      } else {
        next.push(p);
      }
    }
    if (changed) {
      steps.push(next.slice());
      cutsMade.push(cutMade);
      frontier = next;
    }
  }
  return { steps, cutsMade };
}

function solGo(n) {
  if (!solSteps.length) return;
  n = Math.max(0, Math.min(solSteps.length - 1, n));
  solCur = n;
  updateStepUI();
  renderSolution();
}

function updateStepUI() {
  const total = solSteps.length - 1;
  document.getElementById('step-counter').textContent = solCur + ' / ' + total;
  
  const btnPrev  = document.getElementById('btn-prev');
  const btnNext  = document.getElementById('btn-next');
  const btnFirst = document.querySelector('.step-btn[title="First"]');
  const btnLast  = document.querySelector('.step-btn[title="Last"]');

  if (btnPrev)  btnPrev.disabled  = solCur <= 0;
  if (btnNext)  btnNext.disabled  = solCur >= total;
  if (btnFirst) btnFirst.disabled = solCur <= 0;
  if (btnLast)  btnLast.disabled  = solCur >= total;

  const info = document.getElementById('step-info');
  if (solCur === 0) {
    info.textContent = 'Initial sheet — no cuts made.';
  } else if (solCur === total) {
    info.textContent = 'Final state — ' + solSteps[total].length + ' pieces.';
  } else {
    const c = solCutsMade[solCur];
    if (c) {
      const dir = c.type === 'x' ? 'vertical' : 'horizontal';
      info.textContent = 'Step ' + solCur + ': ' + dir + ' cut at '
        + (c.type === 'x' ? 'x=' + (c.px + c.pos) : 'y=' + (c.py + c.pos))
        + ' → ' + solSteps[solCur].length + ' pieces.';
    }
  }
}

// ══════════════════════════════════════════════════════════════════
// VIEW STATE
// ══════════════════════════════════════════════════════════════════
function resetView() { viewZoom = 1.0; viewPanX = 0; viewPanY = 0; }

function getBaseScale(areaW, areaH, W, H) {
  return Math.min((areaW - MARGIN * 2) / W, (areaH - MARGIN * 2) / H);
}

function clampPan(area, baseScale, W, H) {
  const sw = W * baseScale * viewZoom;
  const sh = H * baseScale * viewZoom;
  const minPanX = Math.min(0, area.clientWidth  - MARGIN - sw - MARGIN);
  const minPanY = Math.min(0, area.clientHeight - MARGIN - sh - MARGIN);
  viewPanX = Math.max(minPanX, Math.min(0, viewPanX));
  viewPanY = Math.max(minPanY, Math.min(0, viewPanY));
}

// ══════════════════════════════════════════════════════════════════
// SHEET RENDERER
// ══════════════════════════════════════════════════════════════════
function renderSheet() {
  if (currentMode !== 'sheet') return;
  sheetW = +document.getElementById('sheet-w').value;
  sheetH = +document.getElementById('sheet-h').value;
  if (!sheetW || !sheetH) return;

  const area  = document.getElementById('canvas-area');
  const ph    = document.getElementById('canvas-placeholder');
  if (ph) ph.style.display = 'none';

  const areaW = area.clientWidth  || 600;
  const areaH = area.clientHeight || 500;
  const baseScale = getBaseScale(areaW, areaH, sheetW, sheetH);
  const scale = baseScale * viewZoom;
  const sw = Math.round(sheetW * scale);
  const sh = Math.round(sheetH * scale);

  let canvas = area.querySelector('canvas');
  if (!canvas) { canvas = document.createElement('canvas'); area.appendChild(canvas); }
  canvas.width  = areaW;
  canvas.height = areaH;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, areaW, areaH);
  const ox = MARGIN + viewPanX;
  const oy = MARGIN + viewPanY;

  // hatched background
  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, sw, sh); ctx.clip();
  ctx.fillStyle = '#f0ede8';
  ctx.fillRect(ox, oy, sw, sh);
  ctx.strokeStyle = '#b0a898'; ctx.lineWidth = 0.7;
  ctx.beginPath();
  for (let k = -sh; k < sw + sh; k += 20) {
    ctx.moveTo(ox + k, oy); ctx.lineTo(ox + k + sh, oy + sh);
  }
  ctx.stroke();
  ctx.restore();

  // defects
  for (const d of defects) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(ox + d.x * scale, oy + (sheetH - d.y - d.height) * scale,
                 d.width * scale, d.height * scale);
  }

  // sheet border
  ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, sw, sh);

  // axis labels
  ctx.fillStyle = '#000000'; ctx.font = '14px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('0', ox, oy + sh + 6);
  ctx.fillText(sheetW, ox + sw, oy + sh + 6);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('0', ox - 6, oy + sh);
  ctx.fillText(sheetH, ox - 6, oy);

  // defect ticks
  ctx.font = '12px Georgia, serif';
  for (const d of defects) {
    const dx0 = ox + d.x * scale;
    const dx1 = ox + (d.x + d.width) * scale;
    const dy0 = oy + (sheetH - d.y) * scale;
    const dy1 = oy + (sheetH - d.y - d.height) * scale;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    if (d.x > 0 && d.x < sheetW)       ctx.fillText(d.x,           dx0, oy + sh + 6);
    if (d.x + d.width < sheetW)         ctx.fillText(d.x+d.width,   dx1, oy + sh + 6);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    if (d.y > 0 && d.y < sheetH)       ctx.fillText(d.y,           ox - 6, dy0);
    if (d.y + d.height < sheetH)        ctx.fillText(d.y+d.height,  ox - 6, dy1);
  }
}

// ══════════════════════════════════════════════════════════════════
// SOLUTION RENDERER
// ══════════════════════════════════════════════════════════════════
function renderSolution() {
  if (!solutionData || !solSteps.length) return;

  const sol   = solutionData;
  const W     = sol.problem.sheet_size[0];
  const H     = sol.problem.sheet_size[1];
  const defs  = sol.problem.defects || [];
  const sitems = sol.problem.items  || [];

  const area  = document.getElementById('canvas-area');
  const ph    = document.getElementById('canvas-placeholder');
  if (ph) ph.style.display = 'none';

  const areaW = area.clientWidth  || 600;
  const areaH = area.clientHeight || 500;
  const baseScale = getBaseScale(areaW, areaH, W, H);
  const scale = baseScale * viewZoom;
  const sw = Math.round(W * scale);
  const sh = Math.round(H * scale);

  let canvas = area.querySelector('canvas');
  if (!canvas) { canvas = document.createElement('canvas'); area.appendChild(canvas); }
  canvas.width  = areaW;
  canvas.height = areaH;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, areaW, areaH);

  const ox = MARGIN + viewPanX;
  const oy = MARGIN + viewPanY;

  // white base
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ox, oy, sw, sh);

  // draw pieces
  for (const p of solSteps[solCur])
    drawSolPiece(ctx, p, sitems, W, H, scale, ox, oy);

  // defects
  for (const d of defs) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(ox + d.x * scale, oy + (H - d.y - d.height) * scale,
                 d.width * scale, d.height * scale);
  }

  // past cuts (black)
  ctx.strokeStyle = '#000000';
  ctx.lineWidth   = 1.0;
  for (let s = 1; s < solCur; s++) {
    if (solCutsMade[s]) drawCutLine(ctx, solCutsMade[s], H, scale, ox, oy);
  }

  // current cut (red)
  if (solCur > 0 && solCutsMade[solCur]) {
    const c = solCutsMade[solCur];
    ctx.strokeStyle = '#cc0000';
    ctx.lineWidth   = 2.5;
    drawCutLine(ctx, c, H, scale, ox, oy);

    // red coordinate label
    ctx.fillStyle = '#cc0000';
    ctx.font = 'bold 13px Georgia, serif';
    if (c.type === 'x') {
      const lx = ox + (c.px + c.pos) * scale;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(c.px + c.pos, lx, oy + sh + 6);
    } else {
      const ly = oy + (H - (c.py + c.pos)) * scale;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(c.py + c.pos, ox - 6, ly);
    }
  }

  // sheet border
  ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, sw, sh);

  // axis labels
  ctx.fillStyle = '#000000'; ctx.font = '14px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('0', ox, oy + sh + 6);
  ctx.fillText(W,   ox + sw, oy + sh + 6);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('0', ox - 6, oy + sh);
  ctx.fillText(H,   ox - 6, oy);
}

function drawCutLine(ctx, c, H, scale, ox, oy) {
  ctx.beginPath();
  if (c.type === 'x') {
    const lx  = ox + (c.px + c.pos) * scale;
    const top = oy + (H - (c.py + c.ph)) * scale;
    const bot = oy + (H - c.py) * scale;
    ctx.moveTo(lx, top); ctx.lineTo(lx, bot);
  } else {
    const ly    = oy + (H - (c.py + c.pos)) * scale;
    const left  = ox + c.px * scale;
    const right = ox + (c.px + c.pw) * scale;
    ctx.moveTo(left, ly); ctx.lineTo(right, ly);
  }
  ctx.stroke();
}

function drawSolPiece(ctx, p, items, W, H, scale, ox, oy) {
  const node = p.node;
  if (!node) return;

  const sx = ox + p.x * scale;
  const sy = oy + (H - p.y - p.h) * scale;
  const sw = p.w * scale;
  const sh = p.h * scale;

  if (node.type === 'fill') {
    const item  = items[node.item];
    if (!item) { drawWasteRect(ctx, sx, sy, sw, sh); return; }
    const color = ITEM_COLORS[node.item % ITEM_COLORS.length];
    const iw    = item.width  * scale;
    const ih    = item.height * scale;
    const nx    = Math.floor(p.w / item.width);
    const ny    = Math.floor(p.h / item.height);
    const label = item.width + '×' + item.height;
    const fs    = Math.max(8, Math.min(14, iw * 0.25, ih * 0.4));

    for (let i = 0; i < nx; i++) {
      for (let j = 0; j < ny; j++) {
        const tx = ox + (p.x + i * item.width) * scale;
        const ty = oy + (H - p.y - (j + 1) * item.height) * scale;
        ctx.fillStyle = color + 'aa';
        ctx.fillRect(tx, ty, iw, ih);
        ctx.strokeStyle = color; ctx.lineWidth = 1.5;
        ctx.strokeRect(tx + 0.5, ty + 0.5, iw - 1, ih - 1);
        if (fs >= 8 && iw > 20 && ih > 12) {
          ctx.fillStyle = '#000000';
          ctx.font = 'bold ' + fs + 'px Georgia, serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(label, tx + iw / 2, ty + ih / 2);
        }
      }
    }

    const usedW = nx * item.width;
    const usedH = ny * item.height;
    if (usedW < p.w)
      drawWasteRect(ctx, ox + (p.x + usedW) * scale, sy, (p.w - usedW) * scale, sh);
    if (usedH < p.h)
      drawWasteRect(ctx, sx, sy, usedW * scale, (p.h - usedH) * scale);

  } else if (node.type === 'empty' || node.type === 'defect') {
    drawWasteRect(ctx, sx, sy, sw, sh);
  } else {
    // unresolved cut — hatched
    ctx.fillStyle = '#f0ede8';
    ctx.fillRect(sx, sy, sw, sh);
    ctx.save();
    ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
    ctx.strokeStyle = '#b0a898'; ctx.lineWidth = 0.7;
    for (let k = -sh; k < sw + sh; k += 20) {
      ctx.beginPath();
      ctx.moveTo(sx + k, sy); ctx.lineTo(sx + k + sh, sy + sh);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawWasteRect(ctx, sx, sy, sw, sh) {
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(sx, sy, sw, sh);
  ctx.save();
  ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let k = -(sw+sh); k < sw+sh; k += 9) {
    ctx.moveTo(sx + k, sy); ctx.lineTo(sx + k + sh, sy + sh);
  }
  ctx.stroke();
  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════
// ZOOM
// ══════════════════════════════════════════════════════════════════
function applyZoom(delta, cx, cy) {
  const area  = document.getElementById('canvas-area');
  const W = currentMode === 'solution' && solutionData
    ? solutionData.problem.sheet_size[0] : sheetW;
  const H = currentMode === 'solution' && solutionData
    ? solutionData.problem.sheet_size[1] : sheetH;
  const baseScale = getBaseScale(area.clientWidth, area.clientHeight, W, H);

  const oldZoom = viewZoom;
  viewZoom = Math.max(0.2, Math.min(20, viewZoom * (1 + delta)));
  const ratio = viewZoom / oldZoom;
  const ox = MARGIN + viewPanX;
  const oy = MARGIN + viewPanY;
  viewPanX = cx - ratio * (cx - ox) - MARGIN;
  viewPanY = cy - ratio * (cy - oy) - MARGIN;
  clampPan(area, baseScale, W, H);
  if (currentMode === 'sheet') renderSheet(); else renderSolution();
}

// ══════════════════════════════════════════════════════════════════
// MOUSE EVENTS
// ══════════════════════════════════════════════════════════════════
const canvasArea = document.getElementById('canvas-area');

canvasArea.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvasArea.getBoundingClientRect();
  applyZoom(e.deltaY < 0 ? 0.15 : -0.15,
            e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

canvasArea.addEventListener('mousedown', e => {
  isPanning = true;
  panStartX = e.clientX; panStartY = e.clientY;
  panStartViewX = viewPanX; panStartViewY = viewPanY;
});

window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  const area = document.getElementById('canvas-area');
  const W = currentMode === 'solution' && solutionData
    ? solutionData.problem.sheet_size[0] : sheetW;
  const H = currentMode === 'solution' && solutionData
    ? solutionData.problem.sheet_size[1] : sheetH;
  const baseScale = getBaseScale(area.clientWidth, area.clientHeight, W, H);
  viewPanX = panStartViewX + (e.clientX - panStartX);
  viewPanY = panStartViewY + (e.clientY - panStartY);
  clampPan(area, baseScale, W, H);
  if (currentMode === 'sheet') renderSheet(); else renderSolution();
});

window.addEventListener('mouseup', () => { isPanning = false; });

// ══════════════════════════════════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════════════════════════════════
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const area = document.getElementById('canvas-area');
  const W = currentMode === 'solution' && solutionData
    ? solutionData.problem.sheet_size[0] : sheetW;
  const H = currentMode === 'solution' && solutionData
    ? solutionData.problem.sheet_size[1] : sheetH;
  const baseScale = getBaseScale(area.clientWidth, area.clientHeight, W, H);
  const step = 20;

  if (e.key === 'w' || e.key === 'W') { viewPanY += step; clampPan(area, baseScale, W, H); }
  if (e.key === 's' || e.key === 'S') { viewPanY -= step; clampPan(area, baseScale, W, H); }
  if (e.key === 'a' || e.key === 'A') { viewPanX += step; clampPan(area, baseScale, W, H); }
  if (e.key === 'd' || e.key === 'D') { viewPanX -= step; clampPan(area, baseScale, W, H); }
  if (e.key === 'r' || e.key === 'R') { resetView(); }

  if (currentMode === 'solution') {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { solGo(solCur + 1); return; }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { solGo(solCur - 1); return; }
  }

  if (e.ctrlKey && (e.key === '+' || e.key === '=')) {
    e.preventDefault();
    applyZoom(0.2, area.clientWidth / 2, area.clientHeight / 2); return;
  }
  if (e.ctrlKey && e.key === '-') {
    e.preventDefault();
    applyZoom(-0.2, area.clientWidth / 2, area.clientHeight / 2); return;
  }

  if (currentMode === 'sheet') renderSheet(); else renderSolution();
});

window.addEventListener('resize', () => {
  if (currentMode === 'sheet') renderSheet(); else renderSolution();
});

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
renderSheet();
</script>
